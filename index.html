<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Background Image Website</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            
            /* Background image */
            background-image: url("newpic.jpg");

            /* Make it cover entire screen */
            background-size: cover;

            /* Center the image */
            background-position: center;

            /* Prevent repeating */
            background-repeat: no-repeat;

            /* Optional: smooth scaling */
            background-attachment: fixed;

            /* Text styling */
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .content {
            padding-top: 20%;
            background-color: rgba(0, 0, 0, 0.4); /* optional overlay */
            height: 100%;
        }
    </style>
</head>

<body>

    <div class="content">
        <h1>Welcome to My Website</h1>
        <p>This website has a full background image.</p>
    </div>

</body>
</html>
